  <!-- Subtle inner border for premium appearance -->
  <rect x="2" y="2" width="124" height="124" rx="34" fill="none" stroke="#27272a" stroke-width="2" />
  
  <!-- Monoline, premium designer branding with AH serif-modern letters -->
  <text x="64" y="84" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">AH</text>
  
  <!-- Accent orange dot matching portfolio identity -->
  <circle cx="102" cy="32" r="8" fill="#f97316" />
